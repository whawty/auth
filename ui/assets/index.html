<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>whawty.auth</title>
    <link href="css/base.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
  </head>
  <body>
    <main id="page" class="page narrow">

      <header class="host">
        <div class="brand-row">
          <span class="mark"><svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#lock-keyhole"/></svg></span>
          <div id="session" class="session" hidden>
            <span>Logged in as <strong id="session-username"></strong></span>
            <span id="session-admin" class="chip chip-accent" hidden>admin</span>
            <button id="logout" class="btn btn-sm" type="button">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#log-out"/></svg>Log out
            </button>
          </div>
        </div>
        <h1 class="title">whawty<span class="sub">.auth</span></h1>
        <p id="description" class="description">Log in to change your password or manage accounts.</p>
      </header>

      <noscript>
        <p class="alert alert-error">This page needs JavaScript. Please enable it in your browser.</p>
      </noscript>

      <section id="view-login" aria-label="Log in"></section>

      <section id="view-admin" aria-label="Users" hidden></section>

      <section id="view-user" aria-label="Your account" hidden></section>

    </main>

    <dialog id="confirm-dialog" class="sheet" aria-labelledby="confirm-title">
      <form method="dialog">
        <div class="sheet-head">
          <h2 id="confirm-title"></h2>
          <button class="icon-btn" type="submit" value="cancel" aria-label="Close">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#x"/></svg>
          </button>
        </div>
        <div class="sheet-body">
          <p id="confirm-text"></p>
        </div>
        <div class="sheet-foot">
          <button id="confirm-cancel" class="btn" type="submit" value="cancel">Cancel</button>
          <button id="confirm-ok" class="btn btn-danger" type="submit" value="ok">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#trash-2"/></svg><span id="confirm-ok-label"></span>
          </button>
        </div>
      </form>
    </dialog>

    <!-- Browsers offer to save the password when the form disappears after a
         successful request to the server, so app.js removes the form after a
         successful login and adds a fresh copy of it when the login is needed
         again. The form is never submitted natively (method="post" keeps the
         password out of the URL should that ever happen). -->
    <template id="login-template">
      <form id="login-form" class="surface login-card stack" method="post" novalidate>
        <div>
          <label class="label" for="login-username">Username</label>
          <input id="login-username" name="username" class="field" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div>
          <label class="label" for="login-password">Password</label>
          <input id="login-password" name="password" class="field" type="password" autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-error" role="alert" hidden>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#circle-alert"/></svg>
          <span id="login-error-text"></span>
        </div>
        <button id="login-submit" class="btn btn-primary btn-block" type="submit">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#log-in"/></svg>Log in
        </button>
      </form>
    </template>

    <!-- Filled from the template below by js/password.js, which also explains
         when the form is removed after use. -->
    <dialog id="password-dialog" class="sheet" aria-labelledby="password-title"></dialog>

    <template id="password-template">
      <form id="password-form" method="post" novalidate>
        <div class="sheet-head">
          <h2 id="password-title"></h2>
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#x"/></svg>
          </button>
        </div>
        <div class="sheet-body stack">
          <input id="password-username" name="username" type="text" autocomplete="username" hidden>
          <div>
            <label class="label" for="password-new">New password</label>
            <input id="password-new" name="new-password" class="field" type="password" autocomplete="new-password">
            <div id="password-meter" class="meter" data-score="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="meter-text" aria-live="polite">
              <strong id="password-score"></strong>
              <span id="password-crack"></span>
            </div>
            <ul id="password-hints" class="hints"></ul>
          </div>
          <div>
            <label class="label" for="password-retype">Retype password</label>
            <input id="password-retype" class="field" type="password" autocomplete="new-password">
            <div id="password-match" class="match" aria-live="polite"></div>
          </div>
          <div id="password-error" class="alert alert-error" role="alert" hidden>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="vendor/lucide/icons.svg#circle-alert"/></svg>
            <span id="password-error-text"></span>
          </div>
        </div>
        <div class="sheet-foot">
          <button class="btn" type="button" data-close>Cancel</button>
          <button id="password-submit" class="btn btn-primary" type="submit" disabled></button>
        </div>
      </form>
    </template>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
